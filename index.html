/* ============================================================
   0. 공통

*{margin:0;padding:0;box-sizing:border-box}

/* 화면은 상점 하나뿐입니다. 스크롤은 상점(#shop)이 스스로 담당하므로

/* --- 무대 --- */
.stage-wrap{
  position:relative; width:100%; line-height:0; cursor:pointer;
  /* 모바일에서는 말풍선이 무대 위로 솟는 높이만큼 명패 아래 공간을 확보한다. */
  margin-top:var(--bubble-clearance, 0px);
}
#stage{
  width:100%; height:auto; display:block;
  image-rendering:pixelated; image-rendering:crisp-edges;
  border:3px solid #2e2418;
  box-shadow:0 0 0 3px #0a0810, 0 0 30px rgba(255,180,90,.10);
  background:#15111a;
}

/* --- 말풍선 --- */
.bubble{
  /* 꼬리 끝을 캔버스의 정수리(y=22/120)에 고정한다.
     모바일에서 글이 두 줄이 되어도 말풍선은 위로만 커져 얼굴을 가리지 않는다. */
  position:absolute; left:4%; right:4%; top:auto;
  bottom:calc(81.667% + 15px);
  background:#f9f4e4; color:#1f1a12;
  font-size:var(--bubble-font-size); line-height:1.55;
  padding:12px 14px;
  border:3px solid #1f1a12;
  box-shadow:4px 4px 0 rgba(0,0,0,.6), inset 0 0 0 2px #e6dcc0;
  opacity:0; transform:translateY(-5px);
  transition:opacity .2s ease, transform .2s ease;
  min-height:3.2em;
}
.bubble.on{opacity:1; transform:translateY(0)}
/* 꼬리는 캐릭터 머리 바로 위 — 캔버스 x=78 지점 (말풍선 폭 기준 48.6%) */
.bubble::after{
  content:''; position:absolute; left:48.6%; transform:translateX(-50%); bottom:-15px;
  width:18px; height:15px; background:#f9f4e4;
  border-left:3px solid #1f1a12; border-right:3px solid #1f1a12;
  clip-path:polygon(0 0,100% 0,100% 33%,66% 33%,66% 66%,33% 66%,33% 100%,0 100%);
}
.cursor{
  display:inline-block; width:.5em; height:1em; vertical-align:-2px;
  background:#1f1a12; margin-left:2px; animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

/* --- 선택지 --- */
.window{
  background:#100d14;
  border:3px solid #c9a227;
  box-shadow:0 0 0 3px #100d14, 0 0 0 5px #4a3a12;

}
.choices{display:flex; flex-direction:column; gap:5px}
.choice{
  font-family:inherit;
  display:flex; align-items:center; gap:9px;
  width:100%; text-align:left;
  background:transparent; border:0; cursor:pointer;
  color:#e8dcc0; font-size:1rem; line-height:1.45;
  padding:12px 9px;
  transition:background .12s, color .12s;
}
.choice .arrow{opacity:0; color:#c9a227; flex:0 0 auto}
/* 모바일에는 마우스가 없어 :hover 가 일어나지 않습니다.
   손가락을 얹고 있는 동안 :active 로 PC 와 똑같은 표시(▶ 화살표 + 강조)를 줍니다.
   두 번 눌러야 눌리는 일이 없도록 touch-action, 그리고 우리 표시가 늦게 그려지는
   기기에서도 반응이 보이도록 기본 탭 하이라이트 색을 금색 계열로 맞춰 둡니다. */
.choice{touch-action:manipulation; -webkit-tap-highlight-color:rgba(201,162,39,.22)}
.choice:hover, .choice:focus-visible, .choice:active{background:#2a2014; color:#ffe9a8; outline:none}
.choice:hover .arrow, .choice:focus-visible .arrow, .choice:active .arrow{opacity:1}
.choice.booking,
.choice.booking:hover,
.choice.booking:focus-visible,
.choice.booking:active{color:#ffff00}
.choice.booking .arrow{opacity:1; color:#ffff00}

/* --- 아래 고정 막대 --- */

<script>
/* ============================================================================
   A. 도트 그래픽
   ----------------------------------------------------------------------------
   160 x 120 논리 픽셀에 코드로 직접 도트를 찍습니다. 이미지 파일이 없습니다.
   나중에 전문가가 그린 스프라이트(PNG)로 바꾸시려면
   drawFigure() / drawHands() 두 함수만 drawImage() 로 교체하면 됩니다.

   무대: 어느 정보상의 뒷방.
     왼쪽  — 색인 서랍장(문서 보관함), 그 위 장부 등
     가운데 — 집사 차림의 주인이 책상 위 책을 넘기며 읽는다
     오른쪽 — 블라인드 창(차가운 빛), 로터리 전화기
     책상 — 놋쇠 스탠드(따뜻한 빛) · 서류철 · 펼친 책
   ============================================================================ */
const cv  = document.getElementById('stage');
let   ctx = cv.getContext('2d');      /* 배경을 오프스크린에 그릴 때 잠시 바꿔 끼운다 */
const W = 160, H = 120;
ctx.imageSmoothingEnabled = false;

/* 값(밝기) 규율 — 배경 최대 명도는 woodL(#74492a).
   화면 최고 명도 paperH(#f2e6c4)는 펼친 장부·전구·1px 반짝임에만 허용한다.
   그래야 서랍이 64칸이어도 시선은 반드시 책으로 돌아온다. */
const PAL = {
  void_:'#0a0708', wallD:'#120d10', wall:'#1c1418', wallB:'#2a1d1c',
  woodD:'#24160f', wood:'#3a2418', woodM:'#55351f', woodL:'#74492a', woodH:'#9a6438',
  brassD:'#5a4418', brass:'#8f6f28', brassL:'#c39a3e', brassS:'#f0d089',
  paperH:'#f2e6c4', paper:'#dccfa8', paperM:'#b8a883', paperD:'#8a7c5c',
  shade:'#1f3a34', shadeL:'#2f5a4e', bulb:'#ffe9b0', lampLit:'#ffc766',
  sealR:'#8d2b1f', sealL:'#c04030',
  coldD:'#4a6a80', cold:'#7fa8bd', coldL:'#b9d6e2',
  skin:'#dfb08c', skinD:'#bb8763', skinL:'#f0cba9', skinS:'#94654a',
  hair:'#14131b', hairL:'#272533', hairH:'#3d3b4c', hairK:'#07060b',
  suit:'#4e535d', suitL:'#5f646f', suitH:'#71767f', suitD:'#3c414a', suitK:'#2c3038',
  tie:'#242b3a', tieL:'#333b4e',
  shirt:'#ece9df', shirtD:'#c3c0b5',
  frame:'#3c4148', frameH:'#23272c', frameD:'#5d636b', lensW:'#ffffff', lensG:'#f4f2ea',
  white:'#fffaf0', rimW:'#74492a', rimC:'#4a6a80'
};

function P(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)}
function px(x,y,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,1,1)}
function dith(x,y,w,h,c,ph){ctx.fillStyle=c;for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(((x+i+y+j)&1)===(ph||0))ctx.fillRect(x+i,y+j,1,1)}}
function disc(cx,cy,r,c){ctx.fillStyle=c;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y<=r*r)ctx.fillRect(cx+x,cy+y,1,1)}}
function ell(cx,cy,rx,ry,c,fill){
  ctx.fillStyle=c;
  for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++){
    const d=(x*x)/(rx*rx)+(y*y)/(ry*ry);
    if(fill ? d<=1 : (d<=1 && d>0.34)) ctx.fillRect(cx+x,cy+y,1,1);
  }
}

/* ---------- 벽 ----------
   말풍선이 y 6~34 대역을 늘 가리므로 그 위는 '천장의 어둠'으로만 둔다.
   실질 설계 면적은 y 34~120. */
function drawWall(){
  P(0, 0, W, 92, PAL.wallD);
  P(0, 0, W, 22, PAL.void_);
  dith(0, 20, W, 10, PAL.wallD, 0);
  for(let x=-6; x<W; x+=18){ P(x, 24, 15, 68, PAL.wall); P(x+15, 24, 3, 68, PAL.wallD); }
  dith(0, 30, 96, 62, PAL.wallB, 0);            /* 스탠드가 벽에 남기는 반사 */
  dith(6, 44, 62, 40, PAL.wallB, 1);
}

/* ---------- 왼쪽: 장부 서가 2단 ----------
   서랍장이 '찾는 체계'라면 서가는 '찾아지는 실체'.
   아래 칸 하나를 비워 둔다 — 지금 그가 펼쳐 든 책이 방금 거기서 나왔다는 뜻. */
function drawShelves(){
  const cols = ['#3a2018','#23303a','#2c2a1c','#33241f','#252c33'];
  function shelf(boardY, top, gapFrom, gapTo){
    /* 선반 판을 먼저 깔아 밝은 가로선을 만든다.
       빈 칸은 '어두운 구멍'이 아니라 '밝은 선이 드러난 구간'으로 읽혀야 보인다. */
    P(0, boardY,     47, 1, PAL.woodL);
    P(0, boardY + 1, 47, 2, PAL.wood);
    P(0, boardY + 3, 47, 1, PAL.woodD);
    let x = 1, i = 0;
    while(x < 46){
      const w = 4 + (i*7) % 3;
      const inGap = gapFrom !== undefined && x + w > gapFrom && x < gapTo;
      if(!inGap){
        const lean = (gapTo !== undefined && x >= gapTo && x < gapTo + 6) ? -1 : 0;
        P(x + lean, top, w, boardY - top, cols[i % cols.length]);
        P(x + lean, top, 1, boardY - top, 'rgba(255,255,255,0.06)');
        P(x + lean + 1, top + 4, Math.max(1, w - 2), 1, PAL.brass);
      }
      x += w + 1; i++;
    }
  }
  shelf(46, 34);
  shelf(60, 48, 27, 35);                        /* 방금 한 권이 빠져나간 자리 */
}

/* ---------- 오른쪽: 색인 서랍장 벽 ----------
   조사한 작품들이 모두 같은 결론에 수렴한다 —
   '작은 라벨 서랍이 벽을 덮고 있다' = '여기는 기록을 찾아 주는 곳'.
   오른쪽으로 갈수록 어둠에 잠겨 황동 손잡이만 별자리처럼 남는다. */
function drawCabinet(){
  const x0 = 94, y0 = 34, cw = 8, ch = 7, cols = 8, rows = 8;
  P(x0-2, y0-2, W-x0+2, rows*ch+3, PAL.woodD);
  P(x0-2, y0-2, W-x0+2, 1, PAL.woodM);
  for(let c=0;c<cols;c++){
    const dim = c < 3 ? 0 : (c < 5 ? 1 : 2);
    const body   = dim===0 ? PAL.wood  : (dim===1 ? PAL.woodD : PAL.wallD);
    const topL   = dim===0 ? PAL.woodM : (dim===1 ? PAL.wood  : PAL.woodD);
    const pull   = dim===0 ? PAL.brass : (dim===1 ? PAL.brassD: PAL.brassD);
    const label  = dim===0 ? PAL.paperM: (dim===1 ? PAL.paperD: null);
    for(let r=0;r<rows;r++){
      const x = x0 + c*cw, y = y0 + r*ch;
      if(x >= W) continue;
      P(x, y, cw-1, ch-1, body);
      P(x, y, cw-1, 1, topL);
      P(x, y+ch-2, cw-1, 1, PAL.void_);
      if(label) P(x+1, y+1, 4, 1, label);
      P(x+2, y+4, 2, 1, pull);
    }
  }
  /* 규칙성 깨기 — 방금 뭔가를 찾아본 흔적 */
  P(x0+8, y0+21, 7, 6, PAL.woodD);
  P(x0+8, y0+21, 7, 1, PAL.wood);
  P(x0+9, y0+22, 5, 1, PAL.paper);
}

/* ---------- 화면 맨 끝: 문틈으로 새는 찬 빛 ----------
   제2의 광원이 되지 않도록 폭 3px을 넘기지 않는다.
   어두운 집사복이 어두운 벽에 묻히지 않게 하는 유일한 장치이기도 하다. */

  P(151, 24, 1, 64, PAL.woodD);

/* ---------- 카운터 ---------- */
function drawDesk(){

  P(0, 88, W, 1, PAL.wood);
  P(0, 94, W, 2, PAL.woodH);                    /* 앞 모서리 — 전경에만 허용되는 최대 명도 */
  P(0, 96, W, 24, PAL.wood);
  P(0, 96, W, 1, PAL.woodD);
  for(let x=20; x<W; x+=34) P(x, 98, 1, 20, PAL.woodM);
  P(0, 118, W, 2, PAL.woodD);
  /* 황동 명패 — 이름을 걸고 응대하는 곳이라는 표시 */
  P(98, 102, 28, 8, PAL.brass);
  P(98, 102, 28, 1, PAL.brassL); P(98, 102, 1, 8, PAL.brassL);
  P(98, 109, 28, 1, PAL.brassD); P(125, 102, 1, 8, PAL.brassD);
  for(let i=0;i<2;i++) for(let x=102; x<122; x+=2) px(x, 105+i*2, PAL.brassD);
  px(99,103,PAL.brassS); px(124,103,PAL.brassS); px(99,108,PAL.brassS); px(124,108,PAL.brassS);
}

/* ---------- 놋쇠 스탠드 ----------
   화면의 유일한 광원. 갓은 오른쪽 아래로 기울어 빛이 장부 위로 떨어진다.
   램프 자신은 제 그림자 안에 있어 실루엣으로만 읽힌다. */
function drawLamp(flick){
  P(9, 88, 18, 3, PAL.brass);
  P(9, 88, 18, 1, PAL.brassL);
  P(9, 91, 18, 1, PAL.brassD);
  P(17, 66, 3, 22, PAL.brass);
  P(17, 66, 1, 22, PAL.brassL);
  P(19, 66, 1, 22, PAL.brassD);
  for(let i=0;i<11;i++){
    const x0 = 4 + Math.round(i*0.5);
    const w  = 27 - Math.round(i*0.4);
    P(x0, 56+i, w, 1, i<2 ? PAL.shadeL : PAL.shade);
  }
  P(5, 57, 3, 4, PAL.shadeL);
  P(4, 65, 28, 1, PAL.shadeL);
  P(24, 63, 6, 3, PAL.lampLit);                 /* 갓 안쪽 반사 */
  P(27, 63, 3, 3, flick ? PAL.bulb : PAL.lampLit);
  px(28, 64, PAL.white);
}

/* ---------- 끈으로 묶은 사건 기록철 — 이미 끝난 사건들 ----------
   붉은 끈은 쓰지 않는다. 화면에서 채도 높은 색은 장부 위 날인 자국 하나뿐. */
function drawCaseFiles(){
  for(let i=0;i<3;i++){
    const y = 88 - i*4, x = 30 + i*2;
    P(x, y, 18, 4, PAL.paper);
    P(x, y, 18, 1, PAL.paperH);
    P(x, y+3, 18, 1, PAL.paperD);
  }
  P(38, 80, 1, 12, PAL.paperD);
  P(30, 84, 18, 1, PAL.paperD);
  P(38, 83, 2, 2, PAL.paperM);
  P(29, 92, 22, 1, PAL.woodD);
}

/* ---------- 접수 종 — '말을 걸어도 된다'는 신호 ---------- */
function drawBell(){
  P(104, 90, 11, 2, PAL.brassD);
  P(105, 89, 9, 1, PAL.brass);
  for(let i=0;i<5;i++){
    const inset = i<2 ? 0 : i-1;
    P(106+inset, 84+i, 8-inset*2, 1, PAL.brass);

  P(107, 84, 2, 1, PAL.brassS);

/* ---------- 로터리 전화기 — 연락이 닿는 곳이라는 신호 ---------- */
function drawPhone(){
  P(118, 90, 27, 2, PAL.void_);
  P(119, 82, 25, 8, '#241f26');
  P(119, 82, 25, 1, '#3b333f');
  P(119, 89, 25, 1, '#100d12');
  disc(133, 86, 4, '#2e2833');
  ell(133, 86, 4, 4, '#4a4250', false);
  disc(133, 86, 1, '#16131a');
  for(let a=0;a<8;a++){
    const ang = a/8*Math.PI*2 - 1.1;
    px(133+Math.round(Math.cos(ang)*3), 86+Math.round(Math.sin(ang)*3), '#7d7488');
  }
  P(118, 78, 27, 4, '#2e2833');
  P(118, 78, 27, 1, '#463d4c');
  P(117, 76, 7, 3, '#241f26'); P(139, 76, 7, 3, '#241f26');
  P(117, 76, 7, 1, '#3b333f'); P(139, 76, 7, 1, '#3b333f');
}

/* ---------- 인물 ----------
   회색 정장에 짙은 넥타이. 팔은 자연스럽게 내려 손은 카운터 아래로 숨는다.
   어깨~팔은 행마다 하나의 외곽선으로 그려 분절이 생기지 않게 하고,
   그 위에 빛(왼쪽 스탠드)을 따라 밝기 단계를 얹어 입체를 만든다. */
function drawFigure(S){
  const cx = 78;
  const BOT = 96;
  const breathe = Math.sin(S.t/96) > 0.5 ? 1 : 0;
  const up = S.look > 0 ? 2 : 0;
  const hy = 22 - up + breathe;      /* 머리 꼭대기 */
  const sy = hy + 29;                /* 어깨선 */

  /* ============ 상반신 ============ */
  /* 목 밑에서 이미 어느 정도 폭을 갖고 시작해, 완만한 곡선으로 어깨까지 흐른다 */
  const halfAt = (y)=>{
    const i = y - sy;
    if(i < 11) return 13 + Math.round(9 * Math.sin(i/11 * Math.PI/2));
    return 22 + Math.round(3 * (i-11) / (BOT-sy-11));
  };
  for(let y=sy; y<BOT; y++){
    const h = halfAt(y), w = h*2;
    P(cx-h, y, w, 1, PAL.suit);
    P(cx-h,   y, 4, 1, PAL.suitL);        /* 스탠드 쪽 밝은 면 */
    P(cx-h,   y, 2, 1, PAL.suitH);
    P(cx+h-5, y, 5, 1, PAL.suitD);        /* 반대쪽 그늘 */
    P(cx+h-2, y, 2, 1, PAL.suitK);
    px(cx-h,   y, PAL.rimW);
    px(cx+h-1, y, PAL.rimC);
  }
  /* 팔 이음선 — 어깨가 팔로 넘어가는 자리에 1픽셀 그늘만 */
  for(let y=sy+13; y<BOT; y++){
    const h = halfAt(y);
    px(cx-h+11, y, PAL.suitD);
    px(cx+h-12, y, PAL.suitK);
  }

  /* ============ 셔츠 · 라펠 · 넥타이 ============ */
  /* 목 */
  P(cx-3, hy+23, 6, 7, PAL.skinD);
  P(cx-3, hy+23, 2, 7, PAL.skin);
  P(cx-3, hy+23, 6, 1, PAL.skinS);

  /* 셔츠 깃 */
  P(cx-5, sy-2, 10, 2, PAL.shirt);
  P(cx-5, sy-2, 10, 1, '#f6f3ea');

  /* 재킷이 열린 V 안쪽의 셔츠와, 그 가장자리를 따라 흐르는 라펠 */
  for(let i=0;i<15;i++){
    const y = sy + i;
    const w = Math.max(3, 12 - i);
    const l = cx - Math.round(w/2);
    P(l, y, w, 1, PAL.shirt);
    if(i < 3) P(l, y, w, 1, PAL.shirtD);          /* 깃 아래 그늘 */
    if(i < 13){
      P(l-4, y, 4, 1, PAL.suitL);                 /* 스탠드 쪽 라펠 */
      px(l-4, y, PAL.suitH);
      px(l-1, y, PAL.suitK);
      P(l+w, y, 4, 1, PAL.suitD);                 /* 그늘 쪽 라펠 */
      px(l+w,   y, PAL.suitK);
      px(l+w+3, y, PAL.suit);
    }
  }

  /* 넥타이 */
  P(cx-2, sy+1, 5, 4, PAL.tie);
  P(cx-2, sy+1, 5, 1, PAL.tieL);
  px(cx-1, sy+2, PAL.tieL);
  for(let i=0;i<14;i++){
    const w = 3 + Math.round(i/6);
    const x = cx - Math.floor(w/2);
    P(x, sy+5+i, w, 1, PAL.tie);
    px(x, sy+5+i, PAL.tieL);
  }

  /* ============ 머리 ============
     hy+0..6  머리카락 / hy+5..24 얼굴 / hy+12..18 안경 / hy+24 턱 */
  const face = [10,10,10,10,10,10,10,10,10,10,10,10,10,10,9,9,8,7,5];  /* hy+6 부터 */
  for(let i=0;i<face.length;i++){
    const y = hy + 6 + i, half = face[i];
    P(cx-half, y, half*2, 1, PAL.skin);
    P(cx-half, y, 3, 1, PAL.skinL);
    P(cx+half-3, y, 3, 1, PAL.skinD);
    px(cx+half-1, y, PAL.skinS);
  }
  P(cx-5, hy+23, 10, 1, PAL.skinD);              /* 턱 그늘 */
  P(cx-3, hy+24,  6, 1, PAL.skinS);
  px(cx-9, hy+19, PAL.skinD); px(cx+8, hy+19, PAL.skinD);   /* 광대 아래 */
  px(cx-10, hy+8,  PAL.rimW); px(cx-10, hy+11, PAL.rimW);
  px(cx+9,  hy+9,  PAL.rimC); px(cx+9,  hy+12, PAL.rimC);
  /* 귀 */
  P(cx-11, hy+12, 2, 5, PAL.skin); px(cx-11, hy+14, PAL.skinD);
  P(cx+9,  hy+12, 2, 5, PAL.skinD); px(cx+10, hy+14, PAL.skinS);

  /* 머리카락 — 뒤로 넘긴 가르마 (정수리를 둥글게) */
  P(cx-6,  hy,    13, 1, PAL.hair);
  P(cx-8,  hy+1,  17, 1, PAL.hair);
  P(cx-10, hy+2,  20, 4, PAL.hair);
  P(cx-11, hy+3,   2, 9, PAL.hair);
  P(cx+9,  hy+3,   2, 9, PAL.hair);
  P(cx-10, hy+6,   5, 2, PAL.hair);              /* 왼쪽 이마선은 낮게 */
  P(cx+4,  hy+6,   6, 1, PAL.hair);
  /* 가르마와 결 */
  P(cx-5, hy+1,  1, 5, PAL.hairK);
  P(cx-7, hy+2,  2, 1, PAL.hairH);
  P(cx-4, hy+2,  6, 1, PAL.hairH);
  P(cx-3, hy+2,  9, 1, PAL.hairL);
  P(cx+1, hy+3,  7, 1, PAL.hairL);
  P(cx-9, hy+2,  3, 1, PAL.hairL);
  P(cx-9, hy+4,  4, 1, PAL.hairL);
  P(cx-10,hy+7,  1, 4, PAL.hairL);
  P(cx+10,hy+7,  1, 4, PAL.hairL);
  P(cx-11, hy+9,  2, 3, PAL.hair);               /* 구레나룻 */
  P(cx+9,  hy+9,  2, 3, PAL.hair);

  /* 눈썹 */
  P(cx-8, hy+10, 6, 1, PAL.hair);
  P(cx+2, hy+10, 6, 1, PAL.hair);
  px(cx-8, hy+11, PAL.hair);
  px(cx+7, hy+11, PAL.hair);

  /* ============ 안경 ============
     직사각형. 빛을 받아 늘 하얗게 비어 있어 눈이 보이지 않는다. */
  const gy = hy + 15;
  P(cx-8, gy-2, 7, 5, PAL.lensG);
  P(cx+1, gy-2, 7, 5, PAL.lensG);
  P(cx-8, gy-2, 7, 2, PAL.lensW);
  P(cx+1, gy-2, 7, 2, PAL.lensW);
  px(cx-8, gy+2, PAL.shirtD); px(cx+1, gy+2, PAL.shirtD);
  /* 테 — 윗변을 한 픽셀 두껍게 해 인상을 또렷하게 */
  P(cx-9, gy-3, 9, 1, PAL.frameH); P(cx-9, gy+3, 9, 1, PAL.frame);
  P(cx-9, gy-3, 1, 7, PAL.frame);  P(cx-1, gy-3, 1, 7, PAL.frame);
  P(cx,   gy-3, 9, 1, PAL.frameH); P(cx,   gy+3, 9, 1, PAL.frame);
  P(cx,   gy-3, 1, 7, PAL.frame);  P(cx+8, gy-3, 1, 7, PAL.frame);
  px(cx-1, gy-1, PAL.frameD); px(cx, gy-1, PAL.frameD);       /* 브릿지 */
  P(cx-11, gy-2, 2, 1, PAL.frameD);                           /* 안경다리 */
  P(cx+9,  gy-2, 2, 1, PAL.frameD);
  /* 렌즈 밖으로 새는 빛 */
  P(cx-11, gy-4, 3, 1, 'rgba(255,255,255,0.5)');
  P(cx+7,  gy-4, 3, 1, 'rgba(255,255,255,0.4)');
  px(cx+9, gy+2, 'rgba(255,255,255,0.35)');

  /* 코 · 다문 입 */
  px(cx-1, gy+4, PAL.skinD); px(cx-1, gy+5, PAL.skinD);
  P(cx-2, gy+6, 2, 1, PAL.skinS);
  P(cx-3, gy+8, 6, 1, PAL.skinS);
  px(cx-4, gy+8, PAL.skinD); px(cx+3, gy+8, PAL.skinD);
}

/* ---------- 펼친 책 — 화면에서 가장 밝은 물체 ---------- */
function drawBook(){
  const cx = 78, top = 78, bot = 90, h = bot - top;

  dith(cx-28, bot+3, 56, 3, 'rgba(0,0,0,0.45)', 0);

  /* 펼친 면 — 아래로 갈수록 넓어지는 사다리꼴. 오른쪽이 빛을 더 받는다 */
  for(let i=0;i<h;i++){
    const y = top + i, k = i/(h-1);
    const half = Math.round(20 + k*4);
    P(cx-half, y, half,   1, PAL.paper);
    P(cx,      y, half,   1, PAL.paperH);
    px(cx-half, y, PAL.paperD);
    px(cx+half-1, y, PAL.paperM);
  }
  P(cx-20, top, 40, 1, PAL.paperH);

  /* 가운데 접힘 */
  for(let i=0;i<h;i++) px(cx-1, top+i, PAL.paperD);

  /* 종이 두께와 표지 */
  P(cx-25, bot,   50, 2, PAL.paperD);
  for(let i=0;i<6;i++) px(cx-21+i*8, bot, PAL.paperM);
  P(cx-26, bot+2, 52, 2, '#3a2418');
  P(cx-26, bot+2, 52, 1, '#55351f');

  /* 본문 — 글자 대신 줄의 리듬만 */
  for(let s=0;s<2;s++){
    for(let r=0;r<4;r++){
      const y = top + 2 + r*2;
      const k = (y-top)/(h-1);
      const inner = 3;
      const outer = Math.round(18 + k*4);
      const cut = (r===3) ? 6 + ((s*7+r*5)%6) : 0;
      const x0 = s ? cx+inner : cx-outer;
      const len = outer - inner - cut;
      if(len > 2) P(x0, y, len, 1, PAL.paperM);
    }
  }

  /* 오른쪽 면의 날인 자국 — 화면에서 채도를 허락받은 단 하나의 색.
     인장을 그리는 것보다 인장의 '결과'를 그리는 편이 저해상에서 언제나 유리하다. */
  P(cx+15, top+6, 3, 3, PAL.sealR);
  px(cx+17, top+8, PAL.sealL);
}

/* ---------- 스탠드가 만드는 빛 웅덩이 ---------- */
function drawGlow(flick){
  dith(4, 62, 104, 30, 'rgba(255,199,102,0.10)', 0);
  dith(20, 70, 76, 22, 'rgba(255,199,102,0.10)', 1);
  disc(40, 80, 30, 'rgba(255,199,102,0.045)');
  if(flick) disc(34, 76, 14, 'rgba(255,220,160,0.05)');
}

/* ---------- 빛줄기 속 먼지 ---------- */
const MOTES = [[26,84],[45,70],[62,88],[78,66],[95,82]];
function drawMotes(t){
  if(reduced) return;
  for(let i=0;i<MOTES.length;i++){
    const m = MOTES[i];
    const y = 92 - ((t*0.06 + i*17) % 34);
    if(y < 58) continue;
    px(m[0], Math.round(y), i % 2 ? PAL.paperM : PAL.paperD);
  }
}

/* ---------- 가장자리 어둠 ---------- */
function drawVignette(){
  const v1='rgba(8,6,12,0.5)', v2='rgba(8,6,12,0.85)';
  dith(0,0,W,9,v1,0);   dith(0,0,W,4,v2,1);
  dith(0,0,7,H,v1,0);   dith(0,0,3,H,v2,1);
  dith(W-7,0,7,H,v1,0); dith(W-3,0,3,H,v2,1);
  dith(0,H-8,W,8,v1,0); dith(0,H-3,W,3,v2,1);
  P(0,0,W,1,'#08060c'); P(0,H-1,W,1,'#08060c');
  P(0,0,1,H,'#08060c'); P(W-1,0,1,H,'#08060c');
}

/* ---------- 움직임 ----------
   벽 · 서가 · 서랍장은 변하지 않으므로 한 번만 그려 두고 매 프레임 복사한다.
   덕분에 프레임당 fillRect 호출이 1/10 아래로 떨어진다. */
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = { t:0, look:0 };

let bgCanvas = null;
function buildBackground(){
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W; bgCanvas.height = H;
  const real = ctx, off = bgCanvas.getContext('2d');
  off.imageSmoothingEnabled = false;
  ctx = off;
  drawWall(); drawShelves(); drawCabinet();
  ctx = real;
}

let rafId = null;
function tick(){
  const t = ++S.t;
  if(S.look > 0) S.look--;

  /* 스탠드는 평소엔 고르게 밝고, 아주 가끔(약 9초) 잠깐만 흔들린다 */
  const flick = (t % 540) >= 6;

  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bgCanvas, 0, 0);
  drawFigure(S);
  drawDesk();
  drawLamp(flick);
  drawCaseFiles();
  drawBell();
  drawPhone();
  drawBook();
  drawGlow(flick);
  drawMotes(t);
  drawVignette();
  drawDoorSlit();      /* 비네트에 지워지지 않도록 마지막에 */

  rafId = requestAnimationFrame(tick);
}

function startAnim(){ if(rafId === null){ rafId = requestAnimationFrame(tick); } }
function stopAnim(){ if(rafId !== null){ cancelAnimationFrame(rafId); rafId = null; } }
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopAnim(); else startAnim();
});

/* 새 대사가 뜨면 잠깐 고개를 든다. 그 밖의 동작은 두지 않는다. */
function lookUp(){ S.look = 100; }

   B. 대화
   ============================================================================ */
const C = window.SITE_CONTENT;
const R = window.SiteRender;

const bubbleEl = document.getElementById('bubble');
const stageWrapEl = document.getElementById('stageWrap');
const choicesEl = document.getElementById('choices');
const panelSlot = document.getElementById('panelSlot');
const menuEl   = document.getElementById('menu');
const shopEl   = document.getElementById('shop');
const btnBack  = document.getElementById('btnBack');
const privacyLink = document.getElementById('footerPrivacyLink');

let typing = null, fullLine = '', currentId = null;

/*
 * 말풍선 꼬리는 캐릭터 정수리에 고정되어 있으므로, 좁은 화면이나 긴 대사에서는
 * 말풍선 본체가 무대 위로 솟는다. 모바일에서 그 높이를 미리 재어 무대와 이후
 * 콘텐츠를 함께 내리면 명패와는 겹치지 않고 캐릭터와의 거리도 그대로 유지된다.
 */
function fitBubbleBelowNameplate(line){
  if(!window.matchMedia('(max-width:600px)').matches || !line){
    stageWrapEl.style.setProperty('--bubble-clearance', '0px');
    return;
  }
  const currentHTML = bubbleEl.innerHTML;
  bubbleEl.textContent = line;
  const overhang = Math.max(0, -bubbleEl.offsetTop);
  stageWrapEl.style.setProperty('--bubble-clearance', Math.ceil(overhang) + 'px');
  bubbleEl.innerHTML = currentHTML;
}

function type(line, done){
  clearInterval(typing);
  fullLine = line;
  fitBubbleBelowNameplate(line);
  bubbleEl.classList.add('on');
  /* 화면낭독기에는 완성된 문장만 한 번 읽어 준다 (한 글자씩 읽히면 소음이 된다) */
  document.getElementById('srLine').textContent = line;
  if(reduced){ bubbleEl.textContent = line; done && done(); return; }
  let i = 0;
  bubbleEl.innerHTML = '<span class="cursor"></span>';
  typing = setInterval(()=>{
    i++;
    bubbleEl.innerHTML = R.esc(line.slice(0,i)) + '<span class="cursor"></span>';
    if(i >= line.length){ clearInterval(typing); typing = null; bubbleEl.textContent = line; done && done(); }
  }, 42);
}

function finishTyping(){
  if(typing){
    clearInterval(typing); typing = null;
    bubbleEl.textContent = fullLine;
    showBody(C.nodes[currentId]);
  }
}

function showBody(node){
  panelSlot.innerHTML = '';
  if(node.casesList){
    panelSlot.appendChild(buildCasesPanel());
  }else if(node.caseFile !== undefined){
    panelSlot.appendChild(buildCaseDetail(node));
  }else if(node.blocks){
    const p = document.createElement('div');
    p.className = 'panel';
    p.innerHTML = R.panelHTML(node, C);
    panelSlot.appendChild(p);
  }
  choicesEl.innerHTML = '';
  (node.choices || []).forEach(c=>{
    const b = document.createElement('button');
    b.className = 'choice' + (c.featured ? ' booking' : '');
    b.innerHTML = '<span class="arrow">▶</span><span></span>';
    b.lastChild.innerHTML = R.rich(c.label || '');
    b.onclick = ()=>{
      if(c.link){
        const href = (C.links || {})[c.link];
        if(href) window.location.href = href;
        return;
      }
      goto(c.go);
    };
    choicesEl.appendChild(b);
  });
  menuEl.hidden = !(node.choices && node.choices.length);
}

function goto(id, fromHistory){
  const node = C.nodes[id];
  if(!node) return;
  currentId = id;
  if(privacyLink) privacyLink.hidden = id !== 'root';
  lookUp();

  panelSlot.innerHTML = '';
  choicesEl.innerHTML = '';
  menuEl.hidden = true;

  btnBack.hidden = !node.parent;
  btnBack.onclick = ()=> node.parent && goto(node.parent);

  type(node.line || '', ()=> showBody(node));
  /* 타이핑이 어떤 이유로든 끝나지 않아도 내용은 반드시 나타나게 한다 */
  clearTimeout(safety);
  safety = setTimeout(()=>{
    if(!choicesEl.children.length && !panelSlot.children.length) showBody(node);
  }, (node.line || '').length * 50 + 1200);

  shopEl.scrollTop = 0;
  if(!fromHistory){
    /* 사례 화면의 id 에는 한글이 들어가므로 주소창에 넣을 때 부호화한다 */
    try{ history.pushState({node:id}, '', '#' + encodeURIComponent(id)); }catch(e){}
  }
}
let safety = null;

/* 브라우저 뒤로가기로도 한 단계 돌아갈 수 있게 한다 */
window.addEventListener('popstate', (e)=>{
  const id = (e.state && e.state.node) || 'root';
  if(C.nodes[id]) goto(id, true);
});

document.getElementById('stageWrap').onclick = finishTyping;

let bubbleResizeFrame = null;
window.addEventListener('resize', ()=>{
  cancelAnimationFrame(bubbleResizeFrame);
  bubbleResizeFrame = requestAnimationFrame(()=> fitBubbleBelowNameplate(fullLine));
});

/* 아이폰 사파리는 문서에 터치 처리기가 하나라도 있어야 :active 를 적용합니다.
   선택지를 손가락으로 누를 때 PC 처럼 표시가 뜨게 하려면 이 빈 처리기가 필요합니다. */
document.addEventListener('touchstart', function(){}, {passive:true});

/* 하단 편지 아이콘: 안내용 주소를 복사한 뒤 확인 창을 연다. */
const EMAIL_COPY_TEXT = 'joorak@dururagi.com';
const emailCopyButton = document.getElementById('footerEmailIcon');
const emailCopyModal = document.getElementById('emailCopyModal');
const emailCopyClose = document.getElementById('emailCopyClose');
let emailCopyReturnFocus = null;

function legacyCopyText(text){
  const field = document.createElement('textarea');
  field.value = text;
  field.setAttribute('readonly', '');
  field.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(field);
  field.select();
  field.setSelectionRange(0, field.value.length);
  let copied = false;
  const putTextOnClipboard = (e)=>{
    if(!e.clipboardData) return;
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
  };
  document.addEventListener('copy', putTextOnClipboard, {once:true});
  try{ copied = document.execCommand('copy'); }catch(e){}
  document.removeEventListener('copy', putTextOnClipboard);
  field.remove();
  return copied;
}

async function copyEmailAddress(){
  let copied = false;
  if(navigator.clipboard && window.isSecureContext){
    try{
      await navigator.clipboard.writeText(EMAIL_COPY_TEXT);
      copied = true;
    }catch(e){}
  }
  if(!copied) copied = legacyCopyText(EMAIL_COPY_TEXT);
  if(!copied) return;

  emailCopyReturnFocus = document.activeElement;
  emailCopyModal.hidden = false;
  emailCopyClose.focus();
}

function closeEmailCopyModal(){
  emailCopyModal.hidden = true;
  if(emailCopyReturnFocus && emailCopyReturnFocus.focus) emailCopyReturnFocus.focus();
}

emailCopyButton.addEventListener('click', copyEmailAddress);
emailCopyClose.addEventListener('click', closeEmailCopyModal);
emailCopyModal.addEventListener('click', (e)=>{
  if(e.target === emailCopyModal) closeEmailCopyModal();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape' && !emailCopyModal.hidden) closeEmailCopyModal();
});

/* ============================================================================
   B-2. 업무 사례
   ----------------------------------------------------------------------------
   '업무사례' 폴더에 넣은 텍스트 파일이 곧 사례 목록입니다.
     · 파일 이름 규칙 :  유형_사건제목.txt   (같은 유형끼리 묶어 보여 줍니다)
     · 같은 이름의 .png/.jpg/.jpeg 를 넣으면 그 사례 글 위에 사진이 나옵니다.

   폴더의 파일 목록은 배포 때 자동으로 만들어지는 업무사례/manifest.json 에서
   읽습니다. 그것을 읽지 못하는 환경(파일로 직접 열었을 때 등)에서는
   cases-fallback.js 에 저장해 둔 예비 목록을 대신 씁니다.
   ============================================================================ */
const CASE_DIR = '업무사례/';
let caseGroups = [];          /* [{cat:'지식재산권', items:[{base,file,title}...]}...] */
let casesLoaded = false;
const caseTextCache = {};

/* 업무 사례 화면의 문구 — admin 의 '업무 사례' 항목에서 고칠 수 있고,
   비어 있으면 기본 문구를 씁니다. */
const CASES_TXT = C.cases || {};
const casesLine       = CASES_TXT.line       || '몇 가지 기록을 꺼내 왔습니다.';
const casesDetailLine = CASES_TXT.detailLine || '그때의 기록입니다.';
const casesTitle      = CASES_TXT.title      || '업무 사례';

/* '업무 사례' 화면 자체. parent 는 들어온 페이지에 맞춰 그때그때 바뀐다. */
C.nodes.cases = { parent:'about', line:casesLine, casesList:true };

/* 파일 이름 목록 → 유형별 묶음. (시험해 볼 수 있도록 이름을 붙여 둔다) */
function organizeCases(names){
  const items = [];
  (names || []).forEach(n=>{
    if(!/\.txt$/i.test(n)) return;            /* 사례는 텍스트 파일만 */
    if(n.charAt(0) === '_') return;           /* _설명서.txt 같은 안내문은 제외 */
    const base = n.replace(/\.txt$/i, '');
    const cut  = base.indexOf('_');
    items.push({
      file: n, base: base,
      cat:   cut > 0 ? base.slice(0, cut).trim() : '그 밖의 일',
      title: cut > 0 ? base.slice(cut + 1).trim() : base.trim()
    });
  });
  const byCat = new Map();
  items.forEach(it=>{
    if(!byCat.has(it.cat)) byCat.set(it.cat, []);
    byCat.get(it.cat).push(it);
  });
  const groups = [];
  byCat.forEach((arr, cat)=>{
    arr.sort((a,b)=> a.title.localeCompare(b.title, 'ko'));
    groups.push({cat:cat, items:arr});
  });
  groups.sort((a,b)=>{
    if(a.cat === '그 밖의 일') return 1;      /* '그 밖의 일'은 항상 맨 뒤 */
    if(b.cat === '그 밖의 일') return -1;
    return a.cat.localeCompare(b.cat, 'ko');
  });
  return groups;
}

/* 목록 읽기 — 자동 목록(manifest) 먼저, 안 되면 예비 목록 */
const casesReady = (async ()=>{
  let names = null;
  try{
    const r = await fetch(CASE_DIR + 'manifest.json', {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && Array.isArray(j.files)) names = j.files;
    }
  }catch(e){}
  if(!names && window.CASES_FALLBACK && Array.isArray(window.CASES_FALLBACK.files)){
    names = window.CASES_FALLBACK.files;
  }
  caseGroups = organizeCases(names);
  casesLoaded = true;
  /* 사례 하나하나를 대화 화면으로 등록한다 → 뒤로가기·주소 공유가 그대로 동작 */
  caseGroups.forEach(g=> g.items.forEach(it=>{
    C.nodes['case:' + it.base] = {
      parent:'cases', title: it.title, line: casesDetailLine,
      caseFile: it.file, caseCat: g.cat, caseBase: it.base
    };
  }));
  /* 목록보다 먼저 화면에 들어와 '꺼내 오는 중'을 보고 있었다면 다시 그린다 */
  if(currentId === 'cases') showBody(C.nodes.cases);
})();

/* 안내 패널 속 '업무 사례' 버튼(data-goto)을 화면 전환으로 연결한다 */
panelSlot.addEventListener('click', (e)=>{
  const a = e.target && e.target.closest ? e.target.closest('a[data-goto="cases"]') : null;
  if(!a) return;
  e.preventDefault();
  C.nodes.cases.parent = currentId || 'about';   /* 돌아가기 = 들어온 페이지로 */
  goto('cases');
});

/* ── 목록 화면 ── */
function buildCasesPanel(){
  const p = document.createElement('div');
  p.className = 'panel';
  p.innerHTML = '<h3></h3>';
  p.querySelector('h3').textContent = casesTitle;
  if(!casesLoaded){
    p.insertAdjacentHTML('beforeend', '<p class="case-empty">기록을 꺼내 오는 중입니다…</p>');
    return p;
  }
  if(!caseGroups.length){
    p.insertAdjacentHTML('beforeend', '<p class="case-empty">아직 정리된 기록이 없습니다.</p>');
    return p;
  }
  caseGroups.forEach(g=>{
    const h = document.createElement('h4');
    h.textContent = g.cat;
    p.appendChild(h);
    const box = document.createElement('div');
    box.className = 'case-list';
    g.items.forEach(it=>{
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'case-item';
      b.innerHTML = '<span class="arrow">▶</span><span></span>';
      b.lastChild.textContent = it.title;
      b.onclick = ()=> goto('case:' + it.base);
      box.appendChild(b);
    });
    p.appendChild(box);
  });
  return p;
}

/* ── 사례 한 편 ── */
function buildCaseDetail(node){
  const p = document.createElement('div');
  p.className = 'panel';
  p.innerHTML =
    '<h3></h3><p class="tagrow"><span class="tag"></span></p>' +
    '<div class="case-photo-slot"></div>' +
    '<div class="case-body"><p class="case-empty">기록을 꺼내 오는 중입니다…</p></div>';
  p.querySelector('h3').textContent  = node.title;
  p.querySelector('.tag').textContent = node.caseCat;
  attachCasePhoto(p.querySelector('.case-photo-slot'), node.caseBase, node.title);
  fillCaseText(p.querySelector('.case-body'), node);
  return p;
}

/* 같은 이름의 사진(.png → .jpg → .jpeg)을 차례로 찾아보고, 있으면 끼워 넣는다.
   없으면 자리 자체가 사라지므로 글이 바로 위에서 시작된다. */
function attachCasePhoto(slot, base, title){
  const exts = ['png','jpg','jpeg'];
  let i = 0;
  const img = new Image();
  img.className = 'case-photo';
  img.alt = title + ' 사례 이미지';
  img.onload  = ()=> slot.appendChild(img);
  img.onerror = ()=>{ i++; if(i < exts.length) img.src = CASE_DIR + encodeURIComponent(base + '.' + exts[i]); };
  img.src = CASE_DIR + encodeURIComponent(base + '.' + exts[0]);
}

/* 본문 읽기 — 메모장이 어떤 방식(UTF-8/ANSI)으로 저장했든 읽어낸다 */
async function loadCaseText(file){
  if(file in caseTextCache) return caseTextCache[file];
  let text = null;
  try{
    const r = await fetch(CASE_DIR + encodeURIComponent(file), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const buf = await r.arrayBuffer();
    try{ text = new TextDecoder('utf-8', {fatal:true}).decode(buf); }
    catch(e){ text = new TextDecoder('euc-kr').decode(buf); }
  }catch(e){
    const F = window.CASES_FALLBACK;
    if(F && F.texts && (file in F.texts)) text = F.texts[file];
  }
  if(text === null) throw new Error('no-text');
  caseTextCache[file] = text;
  return text;
}

function fillCaseText(body, node){
  const openedId = currentId;
  loadCaseText(node.caseFile).then(txt=>{
    if(currentId !== openedId) return;        /* 읽는 사이 다른 화면으로 갔다면 그만둔다 */
    const t = (txt || '').replace(/\r\n?/g, '\n').trim();
    /* richText 가 **굵게** · {크게|…} · /크게 · 줄바꿈·빈 줄을 전부 살려 준다 */
    body.innerHTML = t
      ? '<p>' + R.richText(t) + '</p>'
      : '<p class="case-empty">이 사건의 기록은 아직 정리하는 중입니다.</p>';
  }).catch(()=>{
    if(currentId !== openedId) return;
    body.innerHTML = '<p class="case-empty">지금은 기록을 불러오지 못했습니다. 잠시 뒤 다시 열어 보세요.</p>';
  });
}

/* ============================================================================
   C. 고정된 글자에 문구 반영
   ----------------------------------------------------------------------------
   명패(사무소 이름 · 변호사 이름)와 '돌아가기' 버튼처럼 HTML 안에 미리 적혀 있는
   글자를, content.js 값으로 덮어씁니다. 편집기로 고친 내용이 바로 보입니다.
   ============================================================================ */
function hydrate(){
  document.querySelectorAll('[data-c]').forEach(n=>{
    const v = n.getAttribute('data-c').split('.').reduce((o,k)=> (o==null?o:o[k]), C);
    if(typeof v === 'string' && v.trim()) n.textContent = v;
  });

  const sizes = C.appearance || {};
  const setSize = (name, value, min, max, fallback)=>{
    const n = Number(value);
    const safe = Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
    document.documentElement.style.setProperty(name, safe + 'px');
  };
  setSize('--office-name-font-size', sizes.officeNameFontSize, 12, 36, 22);
  setSize('--lawyer-name-font-size', sizes.lawyerNameFontSize, 10, 28, 16);
  setSize('--bubble-font-size', sizes.bubbleFontSize, 11, 24, 15);
  setSize('--cta-font-size', sizes.ctaFontSize, 10, 24, 14);
  const profileWidth = Number(sizes.profileImageWidthPercent);
  const safeProfileWidth = Number.isFinite(profileWidth) ? Math.min(100, Math.max(40, profileWidth)) : 68;
  document.documentElement.style.setProperty('--profile-image-width', safeProfileWidth + '%');

  const setColor = (name, value, fallback)=>{
    let safe = String(value || '').trim();
    if(/^[0-9a-f]{6}$/i.test(safe)) safe = '#' + safe;
    if(!/^#[0-9a-f]{6}$/i.test(safe)) safe = fallback;
    document.documentElement.style.setProperty(name, safe);
  };
  setColor('--cta-cases-background', sizes.casesButtonBackgroundColor, '#3C3A44');
  setColor('--cta-cases-text', sizes.casesButtonTextColor, '#FFFFFF');
  setColor('--cta-form-background', sizes.formButtonBackgroundColor, '#F0930D');
  setColor('--cta-form-text', sizes.formButtonTextColor, '#1A1206');

  const mapLink = document.getElementById('footerMapLink');
  const mapUrl = C.links && C.links.naverMap;
  if(mapLink && mapUrl) mapLink.href = mapUrl;

}

/* ============================================================================
   D. 시작
   ============================================================================ */
hydrate();
buildBackground();
startAnim();

/* 주소창에 #about 처럼 붙어 있으면 그 화면부터, 아니면 첫 화면부터.
   사례 주소(#case:…)는 목록을 다 읽은 뒤에야 존재하므로 그때까지 기다린다. */
let first = (location.hash || '').slice(1);
try{ first = decodeURIComponent(first); }catch(e){}
if(C.nodes[first]){
  goto(first, true);
}else if(first.indexOf('case:') === 0){
  goto('cases', true);
  casesReady.then(()=>{ if(C.nodes[first]) goto(first, true); });
}else{
  goto('root', true);
}
</script>
</body>
</html>
